environment:
  matrix:
    - nodejs_version: "20"
    - nodejs_version: "22"
    - nodejs_version: "24"
branches:
  only:
    - main
init:
  - cmd: git config --global core.autocrlf true
install:
  # Get the latest stable version of Node.js or io.js
  - ps: Install-Product node $env:nodejs_version
  # install modules
  - npm install -f
test_script:
  - node --version
  - npm --version
  - npm run lint
on_finish:
  - ps: |
      $env:PATH = 'C:\msys64\usr\bin;' + $env:PATH
# Don't actually build.
build: off
